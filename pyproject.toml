[project]
name = "bourse-project"
version = "1.0.0"
description = "Collecte et exploration d'historiques boursiers (S&P 500, Nasdaq, CAC 40)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "data"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplifications
    "RUF",  # regles ruff
]
ignore = [
    "RUF001",  # caracteres ambigus : les libelles sont en francais
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
